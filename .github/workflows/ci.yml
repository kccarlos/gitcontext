name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm -ws run lint --if-present
        continue-on-error: true
      - name: Web unit tests
        run: npm --workspace apps/web run test:unit
      - name: Desktop frontend tests
        run: npm --workspace apps/desktop run test
      - name: Build web
        run: npm --workspace apps/web run build
      - name: Smoke test the Pages build under /gitcontext/
        run: |
          npx --workspace apps/web playwright install --with-deps chromium
          npm --workspace apps/web run test:pages
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  desktop-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unsigned here; release.yml signs and notarizes the macOS build.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          - os: windows-latest
            args: ""
            rust-targets: ""
            bundle: apps/desktop/src-tauri/target/release/bundle/
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
            bundle: apps/desktop/src-tauri/target/release/bundle/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
      - name: Install dependencies
        run: npm ci
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build Tauri desktop app
        shell: bash
        run: npm run tauri --workspace=gitcontext-desktop -- build ${{ matrix.args }}
      - name: Upload desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.bundle }}
          retention-days: 7
